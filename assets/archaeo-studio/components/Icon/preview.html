<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Icon — 미리보기</title></head>
<body>
<div id="root"></div>
<script>
  var Q = window.ArchaeoStudio, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'as-demo', style:{gap:'10px 14px'}}, Q.ICON_NAMES.map(function(n){
      return h('div', {key:n, title:n, style:{display:'flex',flexDirection:'column',alignItems:'center',gap:4,width:56,fontSize:10.5,color:'var(--ink-muted)'}},
        h('span', {style:{color:'var(--icon)'}}, h(Q.Icon, {name:n, size:22})), n);
    }))
  );
</script>
</body>
</html>
